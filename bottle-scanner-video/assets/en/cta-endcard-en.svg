<!--
  Bottle Scanner ─ CTA End Card (English) 9:16 (1080x1920)
  Use: altE English narration version, SHOT10. Same tone as the JP endcard.
  Export PNG: 1080x1920
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" font-family="'Helvetica Neue','Noto Sans',Arial,sans-serif">
  <defs>
    <radialGradient id="bgE" cx="0.5" cy="0.42" r="0.75"><stop offset="0" stop-color="#26201A"/><stop offset="1" stop-color="#100D0A"/></radialGradient>
    <linearGradient id="amberE" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1C978"/><stop offset="1" stop-color="#D99A34"/></linearGradient>
    <filter id="softGlowE" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bokehE" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bgE)"/>
  <g filter="url(#bokehE)" opacity="0.5">
    <circle cx="180" cy="380" r="70" fill="#E8B451" opacity="0.5"/>
    <circle cx="920" cy="300" r="52" fill="#3FE0C5" opacity="0.4"/>
    <circle cx="880" cy="1500" r="90" fill="#E8B451" opacity="0.35"/>
    <circle cx="160" cy="1580" r="60" fill="#3FE0C5" opacity="0.3"/>
  </g>

  <!-- ICON -->
  <g transform="translate(440,470)">
    <g stroke="#3FE0C5" stroke-width="8" fill="none" stroke-linecap="round" filter="url(#softGlowE)">
      <path d="M8,70 V8 H70"/><path d="M192,70 V8 H130"/><path d="M8,196 V258 H70"/><path d="M192,196 V258 H130"/>
    </g>
    <line x1="18" y1="133" x2="182" y2="133" stroke="#3FE0C5" stroke-width="3" opacity="0.7"/>
    <path d="M86,34 H114 V80 C114,80 134,92 134,118 V198 C134,210 125,218 113,218 H87 C75,218 66,210 66,198 V118 C66,92 86,80 86,80 Z"
          fill="url(#amberE)" stroke="#14110E" stroke-width="2"/>
    <rect x="84" y="22" width="32" height="16" rx="4" fill="#3FE0C5"/>
    <rect x="78" y="142" width="44" height="52" rx="6" fill="#14110E" opacity="0.85"/>
    <path d="M88,168 l7,8 l14,-16" fill="none" stroke="#3FE0C5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="540" y="900" font-size="104" font-weight="800" fill="#F5EFE6" text-anchor="middle" letter-spacing="-2">Bottle <tspan fill="#E8B451">Scanner</tspan></text>
  <line x1="360" y1="965" x2="720" y2="965" stroke="#3FE0C5" stroke-width="3" opacity="0.8"/>

  <text x="540" y="1120" font-size="58" font-weight="800" fill="#F5EFE6" text-anchor="middle">Turn searching time</text>
  <text x="540" y="1200" font-size="58" font-weight="800" fill="#E8B451" text-anchor="middle">into hospitality time.</text>
  <text x="540" y="1320" font-size="38" font-weight="600" fill="#F5EFE6" text-anchor="middle" opacity="0.9">Never lose a bottle again.</text>

  <g transform="translate(540,1500)">
    <rect x="-230" y="-56" width="460" height="112" rx="56" fill="#3FE0C5"/>
    <text x="0" y="14" font-size="46" font-weight="800" fill="#14110E" text-anchor="middle">Link in bio</text>
  </g>
  <path d="M540,1400 l-26,34 h52 z" fill="#3FE0C5" opacity="0.9"/>
  <path d="M540,1382 v40" stroke="#3FE0C5" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
</svg>
