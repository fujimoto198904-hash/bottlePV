<!--
  Bottle Scanner ─ AR スキャンUI オーバーレイ 16:9版（1920x1080・背景透過）
  用途: 16:9併用版のSHOT07。スマホ画面 or 画面全体に重ねる。演出は9:16版と同じ。
  PNG書き出し: 1920x1080・背景透過PNG
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Roboto Mono','SF Mono',monospace">
  <defs>
    <filter id="glow16" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="scanFade16" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FE0C5" stop-opacity="0"/><stop offset="0.5" stop-color="#3FE0C5" stop-opacity="0.9"/><stop offset="1" stop-color="#3FE0C5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- frame corner brackets -->
  <g stroke="#3FE0C5" stroke-width="8" fill="none" stroke-linecap="round" filter="url(#glow16)">
    <path d="M90,250 V100 H280"/><path d="M1830,250 V100 H1640"/>
    <path d="M90,830 V980 H280"/><path d="M1830,830 V980 H1640"/>
  </g>

  <!-- top HUD -->
  <g fill="#3FE0C5" filter="url(#glow16)">
    <circle cx="160" cy="180" r="10"><animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/></circle>
    <text x="190" y="190" font-size="34" letter-spacing="6" font-weight="700">SCANNING…</text>
    <text x="1830" y="190" font-size="30" letter-spacing="3" text-anchor="end" opacity="0.85">BOTTLE SCANNER</text>
  </g>

  <!-- reticle center (target bottle) -->
  <g transform="translate(960,560)">
    <g stroke="#3FE0C5" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#glow16)">
      <path d="M-130,-110 V-230 H-10"/><path d="M130,-110 V-230 H10"/>
      <path d="M-130,150 V270 H-10"/><path d="M130,150 V270 H10"/>
    </g>
    <g stroke="#3FE0C5" stroke-width="3" opacity="0.9"><line x1="-36" y1="20" x2="36" y2="20"/><line x1="0" y1="-16" x2="0" y2="56"/></g>
    <g transform="translate(0,-290)">
      <rect x="-190" y="-42" width="380" height="66" rx="12" fill="#14110E" opacity="0.9" stroke="#3FE0C5" stroke-width="2"/>
      <circle cx="-150" cy="-9" r="14" fill="#3FE0C5"/>
      <path d="M-157,-9 l5,6 l10,-12" fill="none" stroke="#14110E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="-120" y="2" font-size="34" font-weight="700" fill="#3FE0C5" letter-spacing="3">MATCH FOUND</text>
    </g>
  </g>

  <!-- scan line -->
  <rect x="90" y="520" width="1740" height="60" fill="url(#scanFade16)" opacity="0.5"/>
</svg>
