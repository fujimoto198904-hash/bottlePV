<!--
  Bottle Scanner ─ 成功通知トースト（背景透過）
  用途: SHOT07（0:21.5）で AR発見の瞬間にポップイン。SE_0021_notify-piron と同フレーム。
  演出: スケール0.9→1.0＋フェードインで「ピロン」と同時に出す。1.5〜2秒表示。
  PNG書き出し: 背景透過PNG（920x260程度）でエクスポート
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="920" height="260" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D1913"/>
      <stop offset="1" stop-color="#14110E"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="30" y="30" width="860" height="200" rx="36" fill="url(#cardBg)" stroke="#3FE0C5" stroke-width="2.5" filter="url(#cardShadow)"/>

  <!-- check badge -->
  <circle cx="140" cy="130" r="58" fill="#3FE0C5"/>
  <path d="M112,130 l18,20 l34,-40" fill="none" stroke="#14110E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- texts -->
  <text x="235" y="112" font-size="52" font-weight="800" fill="#F5EFE6">山崎 12年</text>
  <text x="235" y="168" font-size="34" font-weight="600" fill="#3FE0C5">ボトルキープ確認</text>
  <!-- shelf location tag -->
  <g>
    <rect x="700" y="92" width="150" height="76" rx="16" fill="#E8B451"/>
    <text x="775" y="128" font-size="26" font-weight="700" fill="#14110E" text-anchor="middle">棚</text>
    <text x="775" y="158" font-size="34" font-weight="800" fill="#14110E" text-anchor="middle">A-7</text>
  </g>
</svg>
