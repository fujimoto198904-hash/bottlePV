<!--
  Bottle Scanner ─ サムネイル / Reelsカバー 9:16版（1080x1920）
  用途: SNSのカバー画像・投稿サムネ・ポスター。フック「そのボトル、何分探してますか？」
  PNG書き出し: 1080x1920 PNG
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Helvetica Neue',sans-serif">
  <defs>
    <radialGradient id="tbg" cx="0.5" cy="0.4" r="0.9"><stop offset="0" stop-color="#2A231C"/><stop offset="1" stop-color="#0E0B08"/></radialGradient>
    <linearGradient id="tamber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1C978"/><stop offset="1" stop-color="#D99A34"/></linearGradient>
    <filter id="tglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="tbokeh" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#tbg)"/>
  <g filter="url(#tbokeh)" opacity="0.55">
    <circle cx="180" cy="1520" r="90" fill="#E8B451" opacity="0.4"/>
    <circle cx="900" cy="1600" r="70" fill="#3FE0C5" opacity="0.35"/>
    <circle cx="920" cy="240" r="60" fill="#E8B451" opacity="0.3"/>
  </g>

  <!-- HOOK -->
  <g text-anchor="middle">
    <text x="540" y="300" font-size="42" font-weight="700" fill="#3FE0C5" letter-spacing="4">─ 新人スタッフの、あるある。 ─</text>
    <text x="540" y="430" font-size="92" font-weight="900" fill="#F5EFE6">そのボトル、</text>
    <text x="540" y="560" font-size="92" font-weight="900" fill="#E8B451">何分探してますか？</text>
  </g>

  <!-- ICON: bottle in scan brackets (big) -->
  <g transform="translate(400,760) scale(1.4)">
    <g stroke="#3FE0C5" stroke-width="8" fill="none" stroke-linecap="round" filter="url(#tglow)">
      <path d="M8,70 V8 H70"/><path d="M192,70 V8 H130"/><path d="M8,196 V258 H70"/><path d="M192,196 V258 H130"/>
    </g>
    <line x1="18" y1="133" x2="182" y2="133" stroke="#3FE0C5" stroke-width="3" opacity="0.7"/>
    <path d="M86,34 H114 V80 C114,80 134,92 134,118 V198 C134,210 125,218 113,218 H87 C75,218 66,210 66,198 V118 C66,92 86,80 86,80 Z"
          fill="url(#tamber)" stroke="#14110E" stroke-width="2"/>
    <rect x="84" y="22" width="32" height="16" rx="4" fill="#3FE0C5"/>
    <rect x="78" y="142" width="44" height="52" rx="6" fill="#14110E" opacity="0.85"/>
    <path d="M88,168 l7,8 l14,-16" fill="none" stroke="#3FE0C5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- MATCH FOUND badge -->
  <g transform="translate(540,1230)" text-anchor="middle">
    <rect x="-230" y="-46" width="460" height="88" rx="44" fill="#3FE0C5"/>
    <text x="10" y="14" font-size="46" font-weight="800" fill="#14110E">かざすだけ、0.5秒。</text>
  </g>

  <!-- WORDMARK + tagline -->
  <g text-anchor="middle">
    <text x="540" y="1560" font-size="86" font-weight="800" fill="#F5EFE6">Bottle <tspan fill="#E8B451">Scanner</tspan></text>
    <text x="540" y="1650" font-size="42" font-weight="700" fill="#3FE0C5">探す時間を、おもてなしの時間に。</text>
    <text x="540" y="1740" font-size="34" font-weight="600" fill="#F5EFE6" opacity="0.85">詳しくはプロフィールから ↑</text>
  </g>
</svg>
